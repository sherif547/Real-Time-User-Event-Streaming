# docker-compose.yml
services:

  ## Zookeeper & Kafka ##
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  broker:
    image: confluentinc/cp-server:7.4.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.4.0
    depends_on:
      - broker
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://broker:9092
    ports:
      - "8081:8081"

  control-center:
    image: confluentinc/cp-enterprise-control-center:7.4.0
    depends_on:
      - broker
      - schema-registry
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: broker:9092
      CONTROL_CENTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_LICENSE: basic
      CONTROL_CENTER_INTERNAL_TOPICS_RF: 1
    ports:
      - "9021:9021"


  ## Spark Cluster ##
  spark-master:
    image: bitnami/spark:latest
    environment:
      SPARK_MODE: master
    volumes:
      - ./spark_stream.py:/opt/bitnami/spark/spark_stream.py
    command: >
      bash -c "pip install --no-cache-dir psycopg2-binary &&
      /opt/bitnami/spark/bin/spark-submit --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.5,org.postgresql:postgresql:42.6.0 /opt/bitnami/spark/spark_stream.py"
    ports:
      - "7077:7077"
      - "9090:8080"




  spark-worker:
    image: bitnami/spark:latest
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077


  ## Postgres (streamdb) ##
  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: streamdb
      POSTGRES_USER: stream
      POSTGRES_PASSWORD: stream
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "stream"]
      interval: 5s
      retries: 5


  ## 1) Airflow DB Init & Admin User ##
  airflow-init:
    image: apache/airflow:2.6.0-python3.9
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: >
      bash -c "
        airflow db init &&
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin \
        || echo '== admin user already exists ==' "
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://stream:stream@postgres:5432/streamdb
    volumes:
      - ./dags:/opt/airflow/dags
      - ./requirements.txt:/requirements.txt


  ## 3) Airflow Scheduler ##
  scheduler:
    image: apache/airflow:2.6.0-python3.9
    depends_on:
      - webserver
    command: >
      bash -c "
        pip install --upgrade pip &&
        pip install --no-cache-dir -r /requirements.txt &&
        exec airflow scheduler"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://stream:stream@postgres:5432/streamdb
    volumes:
      - ./dags:/opt/airflow/dags
      - ./requirements.txt:/requirements.txt

  webserver:
    image: apache/airflow:2.6.0-python3.9
    depends_on:
      - airflow-init
    command: webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://stream:stream@postgres:5432/streamdb
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__FERNET_KEY: ''
    volumes:
      - ./dags:/opt/airflow/dags
      - ./requirements.txt:/requirements.txt
    ports:
      - "8080:8080"

  init-pg:
    image: python:3.9
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts
    working_dir: /scripts
    command: ["python", "init_db.py"]
